name: CI

on:
  pull_request:
  push:
    branches: [main]

# O CI só lê o repositório. Nenhum job recebe permissão de escrita nem segredos.
permissions:
  contents: read

# Um push novo no mesmo PR cancela a execução anterior. Na main, toda execução termina.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  titulo-pr:
    name: Título do PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # O merge é squash: o título do PR vira a mensagem do commit na main.
      - name: Conferir Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|test|refactor|chore|ci|build|perf)(\([a-z0-9-]+\))?!?: .+'
          if ! printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "::error::Título fora do padrão. Use <tipo>(<escopo>): <descrição>, ex.: feat(aprovacao): adiciona cancelamento de envio pendente"
            exit 1
          fi

  qualidade:
    name: Lint, tipos e testes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Lint e formatação
        run: pnpm lint
      - name: Tipos
        run: pnpm typecheck
      - name: Testes unitários e de contrato
        run: pnpm test
      - name: Build do app web
        run: pnpm build

  integracao:
    name: Testes de integração
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        # Mesma imagem do docker-compose.yml.
        image: postgres:18.1
        env:
          POSTGRES_USER: convergia
          POSTGRES_PASSWORD: convergia
          POSTGRES_DB: convergia
        ports:
          - 54320:5432
        options: >-
          --health-cmd "pg_isready -U convergia -d convergia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      # Credenciais do banco descartável do próprio job; não são segredos.
      DATABASE_URL: postgres://convergia:convergia@localhost:54320/convergia
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Testes de integração
        run: pnpm test:integration

  auditoria:
    name: Auditoria de dependências
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Vulnerabilidades altas ou críticas em dependências de produção
        run: pnpm audit --prod --audit-level=high

  # Único check a marcar como obrigatório na proteção da main.
  ci-ok:
    name: CI
    if: always()
    needs: [titulo-pr, qualidade, integracao, auditoria]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Conferir o resultado dos jobs
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
