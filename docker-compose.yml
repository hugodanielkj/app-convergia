services:
  postgres:
    image: postgres:18.1
    environment:
      POSTGRES_USER: convergia
      POSTGRES_PASSWORD: convergia
      POSTGRES_DB: convergia
    ports:
      - "54320:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U convergia -d convergia"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
